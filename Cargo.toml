[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
description = "Fast native Markdown viewer for macOS"
license = "MIT"
repository = "https://github.com/4thel00z/mdview"

[dependencies]
ammonia = "4.2.1"
anyhow = "1.0.104"
comrak = { version = "0.55.0", default-features = false, features = ["syntect"] }
infer = "0.22"
muda = "0.21.0"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSDocumentController"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
open = "5.4.4"
percent-encoding = "2.3"
rfd = "0.17.2"
serde_json = "1"
syntect = "5.3.0"
tao = "0.37.1"
wry = "0.57.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
